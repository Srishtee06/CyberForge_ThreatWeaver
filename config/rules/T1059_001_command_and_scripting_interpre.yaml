description: Detects Base64-encoded or obfuscated PowerShell commands executing hidden
  in-memory payloads.
id: R-11
mitre_id: T1059.001
name: Obfuscated / Encoded PowerShell Execution
pattern: powershell.*-e(nc)?\s+[A-Za-z0-9+/=]{20,}|powershell.*-nop.*-w hidden|downloadstring|iex\s*\(
severity: HIGH
stage: Execution
technique: 'Command and Scripting Interpreter: PowerShell'
