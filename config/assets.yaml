    hostname: "MGMT-GW-01"
    role: "Core Management Gateway & Firewall"
    zone: "mgmt"
    criticality: "CRITICAL"
    asset_value_usd: 10000000
    compliance: ["PCI-DSS", "SOC-2", "ISO-27001"]
    admin_accounts: ["admin", "root", "secops"]
    potential_regulatory_fine_usd: 15000000

  "10.10.99.10":
    hostname: "DC-01"
    role: "Active Directory Domain Controller"
    zone: "mgmt"
    criticality: "CRITICAL"
    asset_value_usd: 8000000
    compliance: ["PCI-DSS", "SOC-2", "HIPAA"]
    admin_accounts: ["administrator", "domain_admin"]
