    admin_accounts: ["dbadmin", "sa"]
    potential_regulatory_fine_usd: 25000000

  "10.10.20.99":
    hostname: "FS-02"
    role: "Corporate Finance & Confidential File Server"
    zone: "dmz"
    criticality: "HIGH"
    asset_value_usd: 4000000
    compliance: ["SOC-2", "GDPR"]
    admin_accounts: ["fs_admin", "backup_svc"]
    potential_regulatory_fine_usd: 5000000

  "10.10.20.144":
    hostname: "APP-SRV-01"
    role: "Customer Web Application Server"
    zone: "dmz"
    criticality: "HIGH"
    asset_value_usd: 3000000
    compliance: ["SOC-2"]
    admin_accounts: ["appadmin"]
    potential_regulatory_fine_usd: 2000000

  # Internal Workstations & Subnets
  "10.10.10.0/24":
    role: "Engineering Workstations Subnet (LAN-1)"
    zone: "internal1"
    criticality: "MEDIUM"
    default_asset_value_usd: 150000
    potential_regulatory_fine_usd: 250000

  "10.10.40.0/24":
    role: "HR & Finance Laptops Subnet (LAN-4)"
    zone: "internal4"
    criticality: "HIGH"
    default_asset_value_usd: 500000
    potential_regulatory_fine_usd: 1000000

  "10.10.30.0/24":
    role: "Operations & Logistics Workstations (LAN-3)"
    zone: "internal3"
    criticality: "MEDIUM"
    default_asset_value_usd: 200000
    potential_regulatory_fine_usd: 300000

  "10.10.50.0/24":
    role: "Vendor & Third-Party Contractor Subnet (LAN-5)"
    zone: "internal5"
    criticality: "MEDIUM"
    default_asset_value_usd: 100000
    potential_regulatory_fine_usd: 500000

crown_jewels:
  - "10.10.20.198" # PCI Payment DB
  - "10.10.99.1"   # Management Gateway
  - "10.10.99.10"  # Domain Controller
  - "10.10.20.99"  # File Server FS-02

network_topology:
  zones:
    wan: { trusted: false, exposure: "INTERNET" }
    internal1: { trusted: true, subnets: ["10.10.10.0/24"] }
    internal2: { trusted: false, subnets: ["10.10.20.0/24"], type: "DMZ" }
    internal3: { trusted: true, subnets: ["10.10.30.0/24"] }
    internal4: { trusted: true, subnets: ["10.10.40.0/24"] }
    internal5: { trusted: false, subnets: ["10.10.50.0/24"], type: "Contractor" }
    mgmt: { trusted: true, subnets: ["10.10.99.0/24"], type: "Management Core" }

